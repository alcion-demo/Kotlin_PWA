services:
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  app:
    build: .
    container_name: kotlin-app
    working_dir: /app

    # Spring Boot 自動起動はせず開発用に待機
    command: tail -f /dev/null

    ports:
      - "8080:8080"
    depends_on:
      - db

    volumes:
      # ソースコード共有
      - ./src:/app/src

      # Gradle キャッシュを永続化（※Windows でも安全）
      - gradle-cache:/home/gradle/.gradle

volumes:
  postgres-data:
  pgadmin-data:

  # Gradle用
  gradle-cache:
