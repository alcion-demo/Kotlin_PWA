<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1976d2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="todo-container">
    <h1>Todo List</h1>

    <!-- 新しい Todo 追加フォーム -->
    <form class="add-todo" th:action="@{/add}" method="post">
        <input type="text" name="title" placeholder="New Todo" required/>
        <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- Todo リスト -->
    <ul class="todo-list">
        <li th:each="todo : ${todos}" th:classappend="${todo.completed}? 'completed'" th:id="'todo-' + ${todo.id}">
            <div class="todo-main">
                <!-- 編集フォーム -->
                <form th:action="@{/edit/{id}(id=${todo.id})}" method="post" class="inline-form">
                    <input type="text" name="title" th:value="${todo.title}" class="edit-input">
                    <button type="submit" class="btn-edit">✏</button>
                </form>
                <!-- 日時表示 -->
                <span class="todo-date" th:text="${#temporals.format(todo.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>

            <div class="actions">
                <form th:action="@{/toggle/{id}(id=${todo.id})}" method="post">
                    <button type="submit" class="toggle">✔</button>
                </form>
                <form th:action="@{/delete/{id}(id=${todo.id})}" method="post">
                    <button type="submit" class="delete">🗑</button>
                </form>
            </div>
        </li>
    </ul>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(() => console.log('SW registered'))
      .catch(e => console.error('SW failed', e));
  }
</script>
</body>
</html>
