server:
  address: 0.0.0.0
  port: 8080

spring:
  # データベース接続設定
  datasource:
    url: jdbc:postgresql://db:5432/todo
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA（データベース操作）の設定
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # テンプレートエンジンの設定（HTML変更を即反映）
  thymeleaf:
    cache: false

  # 開発用ツール（自動再起動）の設定
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s